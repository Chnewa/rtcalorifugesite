<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Réseau de gaines de ventilation calorifugées en local technique">
  <title>Calorifuge de gaines de ventilation en local technique</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202C"/>
      <stop offset="1" stop-color="#0C1420"/>
    </linearGradient>
    <linearGradient id="iso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C2CC"/>
      <stop offset="0.5" stop-color="#8D98A5"/>
      <stop offset="1" stop-color="#5E6975"/>
    </linearGradient>
    <linearGradient id="iso2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3DAE2"/>
      <stop offset="1" stop-color="#79838F"/>
    </linearGradient>
    <linearGradient id="iso3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E7885"/>
      <stop offset="0.4" stop-color="#C3CBD4"/>
      <stop offset="1" stop-color="#69737F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- structure de dalle -->
  <g opacity="0.35" fill="none" stroke="#2C3A4A" stroke-width="6">
    <path d="M0 90 H1200"/><path d="M0 130 H1200"/>
    <path d="M140 0 V800"/><path d="M1050 0 V800"/>
  </g>
  <g opacity="0.25" stroke="#3A4B5E" stroke-width="3">
    <path d="M0 640 H1200"/>
  </g>

  <!-- gaine rectangulaire principale calorifugée -->
  <g>
    <rect x="-20" y="240" width="1240" height="130" fill="url(#iso)"/>
    <rect x="-20" y="240" width="1240" height="16" fill="#E2E7ED" opacity="0.55"/>
    <rect x="-20" y="354" width="1240" height="16" fill="#39424D" opacity="0.6"/>
    <g stroke="#4C5661" stroke-width="3" opacity="0.55">
      <path d="M110 240 V370"/><path d="M330 240 V370"/><path d="M550 240 V370"/>
      <path d="M770 240 V370"/><path d="M990 240 V370"/>
    </g>
    <!-- bandes de finition -->
    <g fill="#0B4A9E" opacity="0.85">
      <rect x="104" y="240" width="12" height="130"/>
      <rect x="544" y="240" width="12" height="130"/>
      <rect x="984" y="240" width="12" height="130"/>
    </g>
  </g>

  <!-- supports -->
  <g stroke="#39444F" stroke-width="10" opacity="0.9">
    <path d="M220 130 V240"/><path d="M660 130 V240"/><path d="M1100 130 V240"/>
  </g>

  <!-- gaine circulaire calorifugée -->
  <g>
    <rect x="-20" y="470" width="1240" height="96" rx="48" fill="url(#iso3)"/>
    <g stroke="#5A646F" stroke-width="3" opacity="0.5">
      <path d="M180 470 V566"/><path d="M420 470 V566"/><path d="M660 470 V566"/><path d="M900 470 V566"/>
    </g>
    <ellipse cx="1180" cy="518" rx="26" ry="48" fill="#48525D"/>
  </g>

  <!-- piquage vertical -->
  <g>
    <rect x="700" y="566" width="110" height="234" fill="url(#iso2)"/>
    <rect x="700" y="566" width="14" height="234" fill="#E2E7ED" opacity="0.4"/>
    <rect x="694" y="700" width="122" height="12" fill="#0B4A9E" opacity="0.8"/>
  </g>

  <!-- second réseau en fond -->
  <g opacity="0.3">
    <rect x="-20" y="90" width="700" height="60" fill="#8F99A5"/>
  </g>

  <text x="600" y="768" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7C8794" letter-spacing="2">[PHOTO DE CHANTIER À REMPLACER]</text>
</svg>
